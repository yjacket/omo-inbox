<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f6">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111214">
	<meta name="description" content="세션이 기다리는 질문과 보고에 답하는 곳">
	<meta name="robots" content="noindex">
	<link rel="icon" href="data:,">
	<title>Inbox</title>
	<style>
		/*
		 * Design tokens (the DESIGN contract for this page, shared with boards.html).
		 * Color: one locked accent (내 차례 chip, unread dot, 🔥 countdown, focus ring).
		 * State is ink at alphas (washes), never a coloured border; 막힘 alone uses the
		 * danger wash. Depth: borders only. Radius: controls 8px, rows 10px, chips pill.
		 * Spacing: 4px base.
		 */
		:root {
			color-scheme: light dark;
			--bg: #f3f4f6;
			--surface: #fcfcfd;
			--ink: #15171b;
			--ink-2: #5b6069;
			--ink-3: #6b707b;
			--ink-rgb: 21 23 27;
			--accent: #b4530a;
			--accent-ink: #fff7ee;
			--ok: #1b6e3f;
			--ok-rgb: 27 110 63;
			--danger: #b42318;
			--danger-rgb: 180 35 24;
			--line: rgb(var(--ink-rgb) / 0.10);
			--line-soft: rgb(var(--ink-rgb) / 0.06);
			--wash-1: rgb(var(--ink-rgb) / 0.04);
			--wash-2: rgb(var(--ink-rgb) / 0.08);
			--font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
			--mono: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
			--fs-title: 1.375rem;
			--fs-row: 0.9375rem;
			--fs-body: 0.875rem;
			--fs-cap: 0.8125rem;
			--fs-micro: 0.75rem;
			--s1: 4px;
			--s2: 8px;
			--s3: 12px;
			--s4: 16px;
			--s5: 20px;
			--s6: 24px;
			--s8: 32px;
			--s10: 40px;
			--r-xs: 4px;
			--r-ctl: 8px;
			--r-row: 10px;
			--r-pill: 999px;
			--t-micro: 120ms ease-out;
			--measure: 920px;
			--ctl-h: 34px;
			--dot: 8px;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #111214;
				--surface: #191b1f;
				--ink: #ecedef;
				--ink-2: #a2a7b1;
				--ink-3: #8a8f99;
				--ink-rgb: 236 237 239;
				--accent: #f0a35c;
				--accent-ink: #1d1206;
				--ok: #6cc48f;
				--ok-rgb: 108 196 143;
				--danger: #f08a80;
				--danger-rgb: 240 138 128;
			}
		}

		*, *::before, *::after { box-sizing: border-box; }
		html { background: var(--bg); -webkit-text-size-adjust: 100%; }
		body {
			margin: 0;
			font: 400 var(--fs-body) / 1.5 var(--font);
			color: var(--ink);
			-webkit-font-smoothing: antialiased;
		}
		.page { max-width: var(--measure); margin: 0 auto; padding: var(--s6) var(--s4) var(--s10); }

		/* header: Inbox, 🙋 N, 알림 받기, Review */
		.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s5); }
		.heads { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
		.tools { display: flex; align-items: center; gap: var(--s2); flex: none; }
		.top[hidden], .ctl[hidden], .count[hidden] { display: none; }
		h1 { margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
		.ctl {
			display: inline-flex;
			align-items: center;
			flex: none;
			font: inherit;
			font-size: var(--fs-cap);
			color: var(--ink-2);
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: var(--r-ctl);
			height: var(--ctl-h);
			padding: 0 var(--s3);
			white-space: nowrap;
			text-decoration: none;
			cursor: pointer;
			transition: background-color var(--t-micro);
		}
		.ctl:hover:not(:disabled) { background-color: var(--wash-1); color: var(--ink); }
		.ctl:active:not(:disabled) { background-color: var(--wash-2); }
		.ctl:disabled { color: var(--ink-3); background: transparent; cursor: default; }
		.ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.ctl.review { position: relative; }
		.badge {
			position: absolute;
			top: -8px;
			right: -8px;
			min-width: 22px;
			height: 22px;
			padding: 0 6px;
			border-radius: 11px;
			background: var(--accent);
			color: #fff;
			font-size: 13px;
			font-weight: 700;
			line-height: 22px;
			text-align: center;
			box-sizing: border-box;
		}
		.badge[hidden] { display: none; }
		.bell[data-state="on"] { color: var(--ok); }

		/* notice */
		.notice {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: var(--s2) var(--s3);
			margin-bottom: var(--s3);
			padding: var(--s2) var(--s3);
			border-radius: var(--r-ctl);
			background: rgb(var(--danger-rgb) / 0.10);
			color: var(--danger);
			font-size: var(--fs-cap);
		}
		.notice[hidden] { display: none; }
		.notice button {
			font: inherit;
			font-weight: 600;
			color: var(--danger);
			background: rgb(var(--danger-rgb) / 0.12);
			border: 0;
			border-radius: 6px;
			height: 28px;
			padding: 0 var(--s3);
			cursor: pointer;
			transition: background-color var(--t-micro);
		}
		.notice button:hover { background: rgb(var(--danger-rgb) / 0.18); }
		.notice button:active { transform: translateY(1px); }
		.notice button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

		/* sections: 내 차례 / 진행 중 / 끝남 */
		.list { display: grid; gap: var(--s6); }
		.group-head {
			display: flex;
			align-items: baseline;
			gap: var(--s1) var(--s2);
			margin: 0 var(--s1) var(--s2);
			min-width: 0;
		}
		.group-head h2 { margin: 0; font-size: var(--fs-body); font-weight: 700; line-height: 1.4; }
		.sum { font-size: var(--fs-micro); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
		.group[data-status="ended"] .group-head h2 { color: var(--ink-2); }
		.group[data-status="hidden"] .rows[hidden] { display: none; }
		.fold {
			margin-left: auto;
			min-height: 32px;
			padding: 0 var(--s2);
			border: 0;
			border-radius: var(--r-ctl);
			background: transparent;
			color: var(--ink-2);
			font: inherit;
			font-size: var(--fs-micro);
			cursor: pointer;
		}
		.fold:hover { background-color: var(--wash-1); color: var(--ink); }
		.fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

		/* rows: one session each, a messenger list */
		.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-row); overflow: hidden; }
		.row {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			column-gap: var(--s3);
			row-gap: var(--s1);
			padding: var(--s3) var(--s4);
			color: inherit;
			text-decoration: none;
			transition: background-color var(--t-micro);
		}
		.row + .row { border-top: 1px solid var(--line-soft); }
		.row:hover { background: var(--wash-1); }
		.row:active { background: var(--wash-2); }
		.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-xs); }
		.row > * { grid-column: 1; min-width: 0; }
		.title { font-size: var(--fs-row); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
		.row[data-unread] .title { font-weight: 700; }
		.group[data-status="ended"] .title { font-weight: 500; color: var(--ink-2); }
		/* right column, row 1: relative time, then the unread dot so every title starts at the same x */
		.when {
			grid-column: 2;
			grid-row: 1;
			align-self: start;
			display: flex;
			align-items: center;
			gap: var(--s2);
			padding-top: 2px;
			font-size: var(--fs-cap);
			font-variant-numeric: tabular-nums;
			color: var(--ink-3);
			white-space: nowrap;
		}
		.dot { flex: none; width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--accent); }
		.meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); }
		.where { font-size: var(--fs-cap); color: var(--ink-2); overflow-wrap: anywhere; }
		.fire {
			grid-column: 2;
			grid-row: 2;
			justify-self: end;
			align-self: center;
			font-size: var(--fs-cap);
			font-weight: 600;
			font-variant-numeric: tabular-nums;
			color: var(--accent);
			white-space: nowrap;
		}
		.fire[hidden] { display: none; }
		.line {
			font-size: var(--fs-cap);
			color: var(--ink-2);
			overflow-wrap: anywhere;
			display: -webkit-box;
			-webkit-box-orient: vertical;
			-webkit-line-clamp: 2;
			overflow: hidden;
		}
		.group[data-status="ended"] .line { color: var(--ink-3); -webkit-line-clamp: 1; }

		.chip {
			display: inline-flex;
			align-items: center;
			height: 20px;
			padding: 0 var(--s2);
			border-radius: var(--r-pill);
			font-size: var(--fs-micro);
			font-weight: 600;
			line-height: 1;
			white-space: nowrap;
		}
		.chip-needs { background: var(--accent); color: var(--accent-ink); }
		.chip-blocked { background: rgb(var(--danger-rgb) / 0.14); color: var(--danger); }
		.chip-working { background: var(--wash-2); color: var(--ink-2); }
		.chip-ended { color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
		.count { height: 24px; font-size: var(--fs-cap); }

		/* empty, loading */
		.empty {
			margin: 0;
			padding: var(--s10) var(--s4);
			text-align: center;
			color: var(--ink-2);
			background: var(--surface);
			border: 1px dashed var(--line);
			border-radius: var(--r-row);
		}
		.sk .row { pointer-events: none; row-gap: var(--s2); }
		.sk-bar { height: 12px; border-radius: var(--r-xs); background: var(--wash-2); }
		.sk-bar.w1 { width: 46%; height: 14px; }
		.sk-bar.w2 { width: 28%; }
		.sk-bar.w3 { width: 34%; }

		@media (min-width: 768px) {
			.page { padding: var(--s8) var(--s6) var(--s10); }
			.top { position: sticky; top: 0; z-index: 1; padding: var(--s2) 0; background: var(--bg); }
			.row { padding: var(--s3) var(--s5); }
		}
		@media (max-width: 360px) {
			.ctl { padding: 0 var(--s2); }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { transition: none !important; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="top">
			<div class="heads">
				<h1>Inbox</h1>
				<span class="chip chip-needs count" id="needsYou" hidden></span>
			</div>
			<nav class="tools" aria-label="도구">
				<button type="button" class="ctl bell" id="bell" hidden>알림 받기</button>
				<a class="ctl review" id="reviewLink" href="/boards">Review<span class="badge" id="reviewBadge" hidden></span></a>
			</nav>
		</header>
		<main>
			<div class="notice" id="notice" role="status" hidden>
				<span>목록을 불러오지 못했습니다.</span>
				<button type="button" id="retry">다시 시도</button>
			</div>
			<div class="list" id="list" aria-busy="true"></div>
		</main>
	</div>
	<noscript><p class="empty">이 페이지는 JavaScript가 필요합니다.</p></noscript>
	<script>
		(() => {
			"use strict";

			const REFRESH_MS = 5000;
			const SKELETON_DELAY_MS = 400;
			const SECTIONS = [
				{ status: "needs-you", label: "내 차례" },
				{ status: "working", label: "진행 중" },
				{ status: "ended", label: "끝남" },
			];
			const KIND_LABEL = { question: "질문", permission: "권한 요청", turn: "보고", blocked: "막힘", done: "끝남", progress: "진행", notice: "알림", board: "Review" };
			const EMPTY_TEXT = "기다리는 세션이 없습니다";

			const els = {
				notice: document.getElementById("notice"),
				retry: document.getElementById("retry"),
				list: document.getElementById("list"),
				needsYou: document.getElementById("needsYou"),
				reviewLink: document.getElementById("reviewLink"),
				reviewBadge: document.getElementById("reviewBadge"),
			};

			let rows = [];
			let needsYou = 0;
			let lastSig = null;
			let requestSeq = 0;
			let timer = null;
			let loaded = false;

			const bell = document.getElementById("bell");
			const BELL_LABEL = { off: "알림 받기", on: "알림 켜짐", blocked: "알림 막힘" };

			function setBell(next) {
				bell.dataset.state = next;
				bell.textContent = BELL_LABEL[next];
				bell.disabled = next === "blocked";
			}

			function postJson(path, body) {
				return fetch(path, {
					method: "POST",
					headers: { "content-type": "application/json", "x-inbox": "1" },
					body: JSON.stringify(body),
				});
			}

			function keyBytes(text) {
				const raw = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
				return Uint8Array.from(raw, (char) => char.charCodeAt(0));
			}

			async function turnOn() {
				if ((await Notification.requestPermission()) !== "granted") {
					setBell(Notification.permission === "denied" ? "blocked" : "off");
					return;
				}
				const registration = await navigator.serviceWorker.register("/sw.js", { type: "module" });
				await navigator.serviceWorker.ready;
				const keyRes = await fetch("/api/push/key", { cache: "no-store" });
				if (!keyRes.ok) throw new Error(`HTTP ${keyRes.status}`);
				const { publicKey } = await keyRes.json();
				const subscription = await registration.pushManager.subscribe({
					userVisibleOnly: true,
					applicationServerKey: keyBytes(publicKey),
				});
				const res = await postJson("/api/push/subscribe", { subscription: subscription.toJSON() });
				if (!res.ok) {
					await subscription.unsubscribe();
					throw new Error(`HTTP ${res.status}`);
				}
				setBell("on");
			}

			async function turnOff() {
				const registration = await navigator.serviceWorker.getRegistration("/sw.js");
				const subscription = registration ? await registration.pushManager.getSubscription() : null;
				if (subscription) {
					const endpoint = subscription.endpoint;
					await subscription.unsubscribe();
					await postJson("/api/push/unsubscribe", { endpoint });
				}
				setBell("off");
			}

			async function initBell() {
				if (!window.isSecureContext || !("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return;
				bell.hidden = false;
				if (Notification.permission === "denied") {
					setBell("blocked");
					return;
				}
				let subscribed = false;
				try {
					const registration = await navigator.serviceWorker.getRegistration("/sw.js");
					subscribed = Boolean(registration && (await registration.pushManager.getSubscription()));
				} catch (error) {
					console.error("inbox: push state failed", error);
				}
				setBell(subscribed ? "on" : "off");
			}

			bell.addEventListener("click", async () => {
				bell.disabled = true;
				try {
					if (bell.dataset.state === "on") await turnOff();
					else await turnOn();
				} catch (error) {
					console.error("inbox: push toggle failed", error);
					await initBell();
				}
				bell.disabled = bell.dataset.state === "blocked";
			});

			// Every piece of session text goes through here as a text node; nothing is parsed as HTML.
			function h(tag, attrs, ...children) {
				const el = document.createElement(tag);
				for (const [key, value] of Object.entries(attrs || {})) {
					if (value == null || value === false) continue;
					el.setAttribute(key, value === true ? "" : value);
				}
				for (const child of children.flat()) {
					if (child == null || child === false) continue;
					el.append(child instanceof Node ? child : String(child));
				}
				return el;
			}

			function monthDay(date) {
				return `${date.getMonth() + 1}월 ${date.getDate()}일`;
			}

			function relativeTime(iso) {
				const at = Date.parse(iso);
				if (Number.isNaN(at)) return "";
				const minutes = Math.floor((Date.now() - at) / 60000);
				if (minutes < 1) return "방금";
				if (minutes < 60) return `${minutes}분 전`;
				const hours = Math.floor(minutes / 60);
				if (hours < 24) return `${hours}시간 전`;
				const days = Math.floor(hours / 24);
				if (days < 7) return `${days}일 전`;
				return monthDay(new Date(at));
			}

			// 🔥 Nm: minutes until the prompt cache goes cold (epoch ms from /cache, or an ISO string); empty once it has.
			function fireText(until) {
				const at = typeof until === "number" ? until : /^\d+$/.test(String(until)) ? Number(until) : Date.parse(until);
				const left = at - Date.now();
				if (!(left > 0)) return "";
				return `🔥 ${Math.ceil(left / 60000)}m`;
			}

			function chipOf(row) {
				const kind = row.newest ? row.newest.kind : "";
				let label = row.status === "working" ? "🤖 진행 중" : row.status === "ended" ? "✅ 끝남" : "🙋 내 차례";
				if (row.status === "needs-you" && kind === "blocked") label = "⛔ 막힘";
				if (kind === "notice" && row.status !== "working") label = "🔔 알림";
				const style = row.status === "working" ? "chip-working" : row.status === "ended" ? "chip-ended" : kind === "blocked" ? "chip-blocked" : "chip-needs";
				return h("span", { class: "chip " + style }, label);
			}

			function rowOf(row) {
				const session = String(row.session);
				const title = row.title || `세션 ${session.slice(0, 8)}`;
				const where = [row.product, row.branch].filter(Boolean).join(" · ");
				const newest = row.newest;
				const at = newest && newest.at ? newest.at : row.waitingSince;
				const label = newest && newest.kind === "progress" && newest.headline ? null : newest ? KIND_LABEL[newest.kind] || newest.kind : null;
				const line = newest ? [label, newest.headline].filter(Boolean).join(" · ") : "";
				const unread = typeof row.unread === "number" && row.unread > 0;
				const fire = row.status === "needs-you" && row.cacheUntil ? fireText(row.cacheUntil) : "";
				return h(
					"a",
					{ class: "row", href: "/s/" + encodeURIComponent(session), "data-session": session, "data-unread": unread || null },
					h("div", { class: "title" }, title),
					h(
						"span",
						{ class: "when" },
						at ? h("time", { class: "time", datetime: at, "data-at": at }, relativeTime(at)) : null,
						unread ? h("span", { class: "dot", role: "img", "aria-label": "안 읽음" }) : null,
					),
					h("div", { class: "meta" }, chipOf(row), row.off ? h("span", { class: "chip chip-ended off" }, "세션 꺼짐") : null, where ? h("span", { class: "where" }, where) : null),
					fire ? h("span", { class: "fire", "data-until": row.cacheUntil }, fire) : null,
					line ? h("div", { class: "line" }, line) : null,
				);
			}

			function sectionOf(section, list) {
				const head = h("div", { class: "group-head" }, h("h2", null, section.label), h("span", { class: "sum" }, String(list.length)));
				return h("section", { class: "group", "data-status": section.status }, head, h("div", { class: "rows" }, ...list.map(rowOf)));
			}

			const HIDDEN_OPEN_KEY = "inbox.hiddenOpen";

			function hiddenOpen() {
				try {
					return localStorage.getItem(HIDDEN_OPEN_KEY) === "1";
				} catch {
					return false;
				}
			}

			function hiddenSection(list) {
				const open = hiddenOpen();
				const rowsEl = h("div", { class: "rows" }, ...list.map(rowOf));
				rowsEl.hidden = !open;
				const fold = h("button", { type: "button", class: "fold", "aria-expanded": open ? "true" : "false" }, open ? "접기" : "펼치기");
				fold.addEventListener("click", () => {
					try {
						localStorage.setItem(HIDDEN_OPEN_KEY, open ? "0" : "1");
					} catch (error) {
						console.error("inbox: hidden setting not saved", error);
					}
					renderList();
				});
				const head = h("div", { class: "group-head" }, h("h2", null, "숨긴 대화"), h("span", { class: "sum" }, String(list.length)), fold);
				return h("section", { class: "group", "data-status": "hidden" }, head, rowsEl);
			}

			function renderList() {
				const focused = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".row") : null;
				const focusedId = focused ? focused.getAttribute("data-session") : null;
				els.list.replaceChildren();
				if (rows.length === 0) {
					els.list.append(h("p", { class: "empty" }, EMPTY_TEXT));
				} else {
					for (const section of SECTIONS) {
						const list = rows.filter((row) => !row.hidden && row.status === section.status);
						if (list.length) els.list.append(sectionOf(section, list));
					}
					const hidden = rows.filter((row) => row.hidden);
					if (hidden.length) els.list.append(hiddenSection(hidden));
				}
				if (focusedId) {
					for (const row of els.list.querySelectorAll(".row[data-session]")) {
						if (row.getAttribute("data-session") === focusedId) {
							row.focus({ preventScroll: true });
							break;
						}
					}
				}
			}

			function renderTimes() {
				for (const el of els.list.querySelectorAll(".time[data-at]")) el.textContent = relativeTime(el.getAttribute("data-at"));
				for (const el of els.list.querySelectorAll(".fire[data-until]")) {
					const text = fireText(el.getAttribute("data-until"));
					el.textContent = text;
					el.hidden = text === "";
				}
			}

			function renderCount() {
				els.needsYou.textContent = needsYou > 0 ? `🙋 ${needsYou}` : "";
				els.needsYou.hidden = needsYou === 0;
				document.title = needsYou > 0 ? `(${needsYou}) Inbox` : "Inbox";
			}

			function renderReviewBadge(n) {
				const count = Number(n) || 0;
				els.reviewBadge.hidden = count === 0;
				els.reviewBadge.textContent = count > 0 ? String(count) : "";
				if (count > 0) els.reviewLink.setAttribute("aria-label", `Review, 내 차례 ${count}건`);
				else els.reviewLink.removeAttribute("aria-label");
			}

			function renderSkeleton() {
				const bars = () => h("div", { class: "row" }, h("div", { class: "sk-bar w1" }), h("div", { class: "sk-bar w2" }), h("div", { class: "sk-bar w3" }));
				els.list.replaceChildren(h("div", { class: "rows sk", "aria-hidden": "true" }, bars(), bars(), bars()));
			}

			async function load() {
				const seq = ++requestSeq;
				const skeleton = loaded ? null : setTimeout(renderSkeleton, SKELETON_DELAY_MS);
				let data;
				try {
					const res = await fetch("/api/threads", { headers: { accept: "application/json" }, cache: "no-store" });
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					data = await res.json();
				} catch (error) {
					if (skeleton) clearTimeout(skeleton);
					if (seq !== requestSeq) return;
					if (!loaded) els.list.replaceChildren();
					els.list.setAttribute("aria-busy", "false");
					els.notice.hidden = false;
					console.error("inbox: load failed", error);
					return;
				}
				if (skeleton) clearTimeout(skeleton);
				if (seq !== requestSeq) return;
				rows = Array.isArray(data.items) ? data.items.filter((row) => row && typeof row === "object" && typeof row.session === "string") : [];
				needsYou = data.counts && typeof data.counts.needsYou === "number" ? data.counts.needsYou : rows.filter((row) => row.status === "needs-you" && !row.hidden).length;
				renderReviewBadge(data.reviews?.mine);
				els.notice.hidden = true;
				els.list.setAttribute("aria-busy", "false");
				const signature = JSON.stringify(rows);
				if (!loaded || signature !== lastSig) {
					lastSig = signature;
					renderList();
				} else {
					renderTimes();
				}
				renderCount();
				loaded = true;
			}

			function startTimer() {
				stopTimer();
				timer = setInterval(() => {
					if (document.visibilityState === "visible") load();
				}, REFRESH_MS);
			}

			function stopTimer() {
				if (timer !== null) {
					clearInterval(timer);
					timer = null;
				}
			}

			els.retry.addEventListener("click", () => load());
			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					load();
					startTimer();
				} else {
					stopTimer();
				}
			});

			load();
			initBell();
			if (document.visibilityState === "visible") startTimer();
		})();
	</script>
</body>
</html>
