<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox</title>
<link rel="icon" href="data:,">
<style>
	/* Tokens: the prototype board.html palette, type and spacing, named so every rule below reads from one place. */
	:root{
		--bg:#f4f5f7;--surface:#fff;--fill:#f2f4f7;
		--ink:#1d2330;--ink-2:#475467;--muted:#667085;--faint:#98a2b3;
		--line:#e4e7ec;--line-2:#d0d5dd;
		--edit:#ff2d55;
		--mark:#1463ff;--mark-fill:rgba(20,99,255,.10);--mark-tint:rgba(20,99,255,.12);--mark-glow:rgba(20,99,255,.35);
		--side-bg:#f0f6ff;--side-line:#c7dcff;--side-ink:#1d3a6b;
		--rec-bg:#e7f6ec;--rec-ink:#1f7a45;
		--chat-bg:#b2c7da;--chat-mine:#fee500;--chat-ink:#191919;--chat-meta:#33445a;--chat-line:rgba(0,0,0,.42);
		--shadow-panel:0 12px 32px rgba(16,24,40,.18);--shadow-fab:0 6px 18px var(--mark-glow);
		--r-xs:3px;--r-sm:7px;--r-md:10px;--r-lg:14px;--r-pill:999px;
		--s-1:4px;--s-2:8px;--s-3:10px;--s-4:12px;--s-5:14px;--s-6:18px;--s-7:20px;--s-8:24px;--s-9:32px;
		--frame-min:150px;--fab-inset:22px;
		--fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-base:15px;--fs-lg:16px;--fs-xl:19px;--fs-2xl:24px;
		--font:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
		--mono:Consolas,"D2Coding",monospace;
	}
	*{box-sizing:border-box}
	[hidden]{display:none !important}
	body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55}
	main{max-width:1180px;margin:0 auto;padding:var(--s-9) var(--s-8) 80px}
	button{font:inherit}

	/* Header: back link, chips, title, revision tabs, banners */
	.top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);margin-bottom:var(--s-5)}
	.back{color:var(--muted);text-decoration:none;font-size:var(--fs-md);padding:var(--s-1) 0}
	.back:hover{color:var(--ink)}
	.chips{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-left:auto}
	.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px var(--s-3);font-size:var(--fs-sm);color:var(--ink-2);max-width:100%}
	.chip i{font-style:normal;color:var(--muted)}
	.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
	.chip.mine{background:var(--ink);border-color:var(--ink);color:#fff}
	.chip.theirs{background:var(--side-bg);border-color:var(--side-line);color:var(--side-ink)}
	.chip.closed{background:var(--fill);color:var(--muted)}
	.chip.ok{background:var(--rec-bg);border-color:var(--rec-bg);color:var(--rec-ink)}
	h1{margin:0 0 6px;font-size:var(--fs-2xl);overflow-wrap:anywhere}
	.titlebar{display:flex;align-items:flex-start;gap:var(--s-3)}
	.titlebar h1{flex:1;min-width:0}
	.listen{flex:none;min-height:40px;padding:0 var(--s-5);border:1px solid var(--line-2);border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font-size:var(--fs-md);font-weight:700;cursor:pointer}
	.listen[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
	.card.reading{box-shadow:0 0 0 3px var(--mark)}
	.lead{margin:0;color:var(--muted)}
	/* 이 안이 나온 이유 sits between the title and the lead; the lead has no margin of its own, so the card keeps the usual card gap below it. */
	#causeCard{margin-bottom:var(--s-5)}
	.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s-5)}
	.tabs button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:var(--r-pill);padding:5px var(--s-5);font-size:var(--fs-sm);font-weight:700;cursor:pointer}
	.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
	.banner{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);margin-top:var(--s-5);border-radius:var(--r-md);padding:var(--s-3) var(--s-5);font-size:var(--fs-md)}
	.banner.new{background:var(--side-bg);border:1px solid var(--side-line);color:var(--side-ink)}
	.banner.new button{margin-left:auto;background:var(--mark);color:#fff;border:none;border-radius:var(--r-sm);padding:6px var(--s-5);font-weight:700;cursor:pointer}
	.banner.done{background:var(--ink);color:#fff}
	.banner.old{background:var(--fill);border:1px solid var(--line);color:var(--ink-2)}
	.banner.error{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}

	/* Legend */
	.legend{display:flex;flex-wrap:wrap;gap:var(--s-3);margin:var(--s-5) 0 var(--s-1)}
	.legend span{display:inline-flex;align-items:center;gap:var(--s-2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:var(--s-1) var(--s-4);font-size:var(--fs-sm)}
	.sw-edit{width:22px;height:14px;border:2px solid var(--edit);border-radius:var(--r-xs)}

	/* Board sections, cards and frames (prototype) */
	section.group{margin-top:26px}
	section.group > h2{margin:0 0 var(--s-1);font-size:var(--fs-xl)}
	section.group > p{margin:0 0 var(--s-3);color:var(--muted);font-size:var(--fs-md)}
	.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s-6) var(--s-7);margin-top:var(--s-5)}
	.card h3{margin:0 0 var(--s-3);font-size:var(--fs-lg);display:flex;gap:var(--s-3);align-items:center}
	.card > h3.only{margin:0}
	.badge{display:inline-flex;min-width:30px;height:26px;padding:0 9px;border-radius:var(--r-sm);background:var(--ink);color:#fff;font-size:var(--fs-md);align-items:center;justify-content:center}
	.badge.gray{background:var(--faint)}
	.note{margin:var(--s-2) 0 0;color:var(--ink-2);font-size:var(--fs-md)}
	.frames{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:var(--s-5);align-items:start}
	.frames.two{grid-template-columns:1fr 1fr}
	.frames.one{grid-template-columns:1fr}
	.frame{position:relative;min-height:var(--frame-min);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#111;touch-action:manipulation;cursor:crosshair}
	.frame.diagram{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:var(--s-4)}
	.frame.still{cursor:default}
	.frame.still canvas{pointer-events:none}
	body.readonly .frame,body.closed .frame{cursor:zoom-in}
	.frame img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
	.frame.diagram img{max-height:720px;width:auto;max-width:100%;margin:0 auto}
	/* A diagram shorter than --frame-min at fit width is shown --frame-min tall and the frame scrolls sideways (board.js sets .wide). */
	.frame.diagram.wide{overflow-x:auto;justify-content:flex-start}
	.frame.diagram.wide img{height:var(--frame-min);max-width:none}
	.frame canvas{position:absolute;inset:0;width:100%;height:100%}
	.frame.plain{display:block;padding:0}
	.frame .fallback{margin:0;padding:38px var(--s-4) 0;color:var(--muted);font-size:var(--fs-sm)}
	.frame pre{margin:0;padding:var(--s-3) var(--s-4) var(--s-4);font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
	.pill{position:absolute;left:var(--s-2);top:var(--s-2);background:var(--ink);color:#fff;font-size:var(--fs-xs);font-weight:700;padding:2px var(--s-2);border-radius:var(--r-md);pointer-events:none}

	/* Marks (prototype) */
	.marks{display:grid;gap:var(--s-4);margin-top:var(--s-3)}
	.mark{display:grid;grid-template-columns:220px 1fr auto;gap:var(--s-4);align-items:start;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-3)}
	.mark img,.mark .nocrop{width:100%;max-height:220px;object-fit:contain;border-radius:6px;background:var(--fill)}
	.mark .nocrop{height:120px}
	.mark b{font-size:var(--fs-sm)}
	.num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--mark);color:#fff;font-size:var(--fs-xs);font-weight:700;align-items:center;justify-content:center;margin-right:6px}
	textarea{width:100%;min-height:64px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:var(--s-2) var(--s-3);font:inherit;font-size:var(--fs-md);resize:vertical;background:var(--surface);color:var(--ink)}
	textarea:disabled{background:var(--fill);color:var(--ink-2)}
	.del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:var(--fs-sm)}
	.del:disabled{visibility:hidden}
	.empty{color:var(--muted);font-size:var(--fs-md);margin:0}

	/* Questions, comment, send (prototype) */
	.q{margin-top:var(--s-5)}
	.q > b{font-size:var(--fs-base)}
	.qhelp{margin:var(--s-1) 0 0;color:var(--ink-2);font-size:13.5px}
	.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s-2);margin:var(--s-2) 0 0}
	.opts label{display:grid;grid-template-columns:auto 1fr;gap:var(--s-1) var(--s-2);align-items:start;border:1px solid var(--line-2);border-radius:var(--r-lg);padding:var(--s-3) var(--s-4);cursor:pointer;font-size:var(--fs-md)}
	.opts label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
	.opts label:has(input:disabled){cursor:default;color:var(--ink-2)}
	.opts input{accent-color:var(--ink);margin-top:var(--s-1)}
	.opts .why{grid-column:2;color:var(--muted);font-size:12.5px;line-height:1.45}
	.side{margin:var(--s-3) 0 0;background:var(--side-bg);border:1px solid var(--side-line);border-radius:var(--r-md);padding:var(--s-3) var(--s-4);font-size:13.5px;color:var(--side-ink)}
	.rec{font-size:11px;background:var(--rec-bg);color:var(--rec-ink);border-radius:var(--r-sm);padding:1px 6px}
	.send{margin-top:var(--s-5);display:flex;gap:var(--s-4);align-items:center;flex-wrap:wrap}
	.send button{flex:none;background:var(--ink);color:#fff;border:none;border-radius:var(--r-md);padding:var(--s-3) var(--s-6);font-size:var(--fs-base);font-weight:700;cursor:pointer}
	.send button.approve{background:var(--rec-ink)}
	.send button:disabled{opacity:.5;cursor:default}
	#status{color:var(--muted);font-size:var(--fs-md)}

	/* Conversation: a chat. Your feedback is a yellow bubble on the right, a session reply a white one on the left, the rest a centered line. */
	.thread{list-style:none;margin:var(--s-3) 0 0;padding:var(--s-5) var(--s-4);display:grid;gap:var(--s-4);background:var(--chat-bg);border-radius:var(--r-lg)}
	.ev{display:flex;flex-direction:column;align-items:center;min-width:0}
	.ev.feedback{align-items:flex-end}
	.ev.reply{align-items:flex-start}
	.evh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--chat-meta)}
	.who{font-weight:700;color:var(--chat-ink)}
	.ev.feedback .who{display:none}
	.ev.reply .who::before{content:"🤖 "}
	.tag{background:rgba(255,255,255,.7);border-radius:var(--r-pill);padding:0 var(--s-2);font-size:var(--fs-xs);color:var(--ink-2)}
	.verdict{font-weight:700;color:var(--ink)}
	.verdict.approve{background:var(--rec-bg);color:var(--rec-ink);border-radius:var(--r-pill);padding:0 var(--s-2)}
	.evb{margin-top:var(--s-1);padding:var(--s-2) var(--s-4);border-radius:var(--r-lg);max-width:78%;font-size:var(--fs-md);line-height:1.5;color:var(--chat-ink);white-space:pre-wrap;overflow-wrap:anywhere}
	.evb:empty{display:none}
	.evb:has(.crops){width:78%}
	.ev.feedback .evb{background:var(--chat-mine);border-top-right-radius:var(--r-xs)}
	.ev.reply .evb{background:var(--surface);border-top-left-radius:var(--r-xs)}
	.ev.submitted .evb,.ev.revised .evb,.ev.closed .evb{background:var(--chat-line);color:#fff;border-radius:var(--r-pill);padding:var(--s-1) var(--s-5);font-size:var(--fs-sm);text-align:center;max-width:90%}
	.evb ul{margin:0 0 var(--s-1);padding-left:var(--s-6);white-space:normal}
	.crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s-3);margin-top:var(--s-2);white-space:normal}
	.crops figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px}
	.crops img{display:block;width:100%;max-height:200px;object-fit:contain;background:var(--fill);border-radius:4px}
	.crops figcaption{font-size:var(--fs-sm);color:var(--ink-2);margin-top:var(--s-1);white-space:pre-wrap}

	/* AI panel (prototype) */
	#aiFab{position:fixed;right:var(--fab-inset);bottom:var(--fab-inset);z-index:20;background:var(--mark);color:#fff;border:none;border-radius:var(--r-pill);padding:var(--s-4) var(--s-6);font-size:var(--fs-base);font-weight:700;box-shadow:var(--shadow-fab);cursor:pointer}
	#aiPanel{position:fixed;right:var(--fab-inset);bottom:78px;z-index:20;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-panel);padding:var(--s-5)}
	#aiPanel h4{margin:0 0 var(--s-1);font-size:var(--fs-base)}
	#aiPanel p{margin:0 0 var(--s-3);color:var(--muted);font-size:var(--fs-sm)}
	#aiPanel button{display:block;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-md);padding:9px var(--s-4);margin-top:var(--s-2);font-size:var(--fs-md);cursor:pointer}
	#aiPanel button small{display:block;color:var(--muted);font-size:var(--fs-xs)}
	#aiMsg{margin-top:var(--s-3);font-size:var(--fs-sm);color:var(--side-ink)}
	#aiMsg:empty{display:none}

	/* Floating 멈추기: while 듣기 reads, the page scrolls card by card and the title-bar button leaves the screen; this one stays, bottom left, clear of #aiFab. */
	#stopFab{position:fixed;left:calc(var(--fab-inset) + env(safe-area-inset-left,0px));bottom:calc(var(--fab-inset) + env(safe-area-inset-bottom,0px));z-index:20;min-height:44px;background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);padding:var(--s-4) var(--s-6);font-size:var(--fs-base);font-weight:700;box-shadow:var(--shadow-panel);cursor:pointer}

	/* Full-screen frame viewer: a dialog over the page; the picture is moved by transform, marks are drawn on a canvas in screen px. */
	body.viewer-open{overflow:hidden}
	.viewer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#0b0d12;color:#fff;touch-action:none;overscroll-behavior:contain}
	.viewer:focus{outline:none}
	.vbar{flex:none;display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) max(var(--s-4),env(safe-area-inset-right)) var(--s-2) max(var(--s-4),env(safe-area-inset-left));padding-top:max(var(--s-2),env(safe-area-inset-top))}
	.vlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-md);font-weight:700}
	.vbar button{flex:none;min-height:44px;padding:0 var(--s-5);border:none;border-radius:var(--r-md);background:rgba(255,255,255,.14);color:#fff;font-size:var(--fs-md);font-weight:700;cursor:pointer}
	.vbar button[aria-pressed="true"]{background:var(--mark)}
	.viewer button:focus-visible{outline:2px solid #fff;outline-offset:2px}
	.vstage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0 max(0px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px,env(safe-area-inset-left))}
	.vstage.drawing{cursor:crosshair}
	.vstage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;background:#111;pointer-events:none;-webkit-user-drag:none}
	.viewer.light .vstage img{background:var(--surface)}
	.vstage canvas{position:absolute;left:0;top:0;pointer-events:none}
	/* The selected box's sheet: number, comment, 지우기. board.js lifts it above the on-screen keyboard through visualViewport. */
	.vsheet{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-3) max(var(--s-4),env(safe-area-inset-right)) max(var(--s-3),env(safe-area-inset-bottom)) max(var(--s-4),env(safe-area-inset-left));background:#0b0d12;border-top:1px solid rgba(255,255,255,.12)}
	.vsheet .num{flex:none;width:28px;height:28px;margin:8px 0 0;font-size:var(--fs-md)}
	.vsheet textarea{flex:1;min-width:0;min-height:44px;max-height:30vh;field-sizing:content;resize:none;font-size:16px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
	.vsheet textarea::placeholder{color:rgba(255,255,255,.5)}
	.vsheet button{flex:none;min-height:44px;padding:0 var(--s-5);border:none;border-radius:var(--r-md);background:rgba(255,255,255,.14);color:#fff;font-size:var(--fs-md);font-weight:700;cursor:pointer}

	/* Mermaid renders here first so getBBox() has real layout; the result is serialized into an <img>. */
	#mmdStage{position:absolute;left:-200000px;top:0;width:1600px;visibility:hidden;pointer-events:none}

	@media (max-width:760px){
		.frames,.frames.two{grid-template-columns:1fr}
		.mark{grid-template-columns:1fr}
		main{padding:22px var(--s-5) 60px}
		.chips{margin-left:0}
		.chip span{max-width:180px}
		.card,.frame,.mark,.ev{flex:none}
		.crops{grid-template-columns:1fr}
	}
</style>
</head>
<body>
<main>
	<nav class="top">
		<a class="back" href="/">← Inbox</a>
		<a class="back" id="threadLink" hidden>‹ 대화</a>
		<div class="chips" id="chips"></div>
	</nav>
	<div class="titlebar"><h1 id="title"></h1><button type="button" class="listen" id="listenBtn" aria-pressed="false" hidden>듣기</button><button type="button" class="listen" id="restartBtn" hidden>처음부터</button></div>
	<section class="card" id="causeCard" hidden>
		<h3 class="only">이 안이 나온 이유</h3>
		<ol class="thread" id="cause"></ol>
	</section>
	<p class="lead" id="lead"></p>
	<div class="tabs" id="tabs" role="tablist" aria-label="안"></div>
	<div class="banner error" id="loadError" hidden></div>
	<div class="banner new" id="revBanner" hidden><span id="revBannerText"></span><button type="button" id="revBannerBtn">보기</button></div>
	<div class="banner done" id="closedBanner" hidden></div>
	<div class="banner old" id="oldNote" hidden>지난 안입니다. 보기만 할 수 있습니다.</div>
	<div class="legend">
		<span><i class="sw-edit"></i>빨간 실선: 바뀐 곳</span>
	</div>
	<div id="sections"></div>
	<section class="card" id="marksCard">
		<h3 class="only">표시한 곳</h3>
		<div class="marks" id="marks"><p class="empty">아직 표시한 곳이 없습니다.</p></div>
	</section>
	<section class="card" id="decideCard">
		<h3 class="only">정할 것</h3>
		<p class="side" id="side" hidden></p>
		<div id="questions"></div>
		<div class="q" id="commentWrap"><b>전체 의견</b><textarea id="comment" style="margin-top:8px"></textarea></div>
		<div class="send" id="sendRow">
			<button id="sendBtn" type="button">재요청</button>
			<button id="approveBtn" type="button" class="approve">승인</button>
			<button id="ackBtn" type="button" hidden>확인</button>
		</div>
		<p id="status"></p>
	</section>
	<section class="card" id="threadCard">
		<h3 class="only">대화</h3>
		<ol class="thread" id="thread"></ol>
	</section>
</main>
<button id="aiFab" type="button">AI에게 묻기</button>
<button id="stopFab" type="button" hidden>멈추기</button>
<div id="aiPanel" hidden>
	<h4>이 Review를 AI와 이야기하기</h4>
	<p>결론은 '전체 의견'에 붙여 넣고 보내세요.</p>
	<div id="aiTargets"></div>
	<div id="aiMsg"></div>
</div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="그림 보기" tabindex="-1" hidden>
	<div class="vbar">
		<span class="vlabel" id="vLabel"></span>
		<button type="button" id="vDraw" aria-pressed="false">표시하기</button>
